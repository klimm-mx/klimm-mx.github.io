<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Klimm</title>
<!-- ===== PWA: instalable + notificaciones en iPhone ===== -->
<meta name="theme-color" content="#0FA3C7">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Klimm">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --fondo:#F5F9FA; --superficie:#FFFFFF; --tinta:#16323B; --tinta-suave:#5A7480;
  --agua:#0FA3C7; --agua-oscuro:#0B7E9A; --agua-claro:#E3F4F9;
  --borde:#DCE7EB; --radio:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fondo);
  color:var(--tinta);font-size:15px;line-height:1.5;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
.contenedor{max-width:640px;margin:0 auto;padding:0 18px}

header{padding:26px 0 10px}
.marca{font-size:26px;font-weight:700;letter-spacing:-.4px}
.marca span{color:var(--agua)}
.sub{font-size:12px;color:var(--tinta-suave);letter-spacing:.9px;text-transform:uppercase;margin-top:2px}

/* Tarjeta principal: Agente */
.hero{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);
  padding:20px;margin-top:20px;text-decoration:none;color:inherit;display:block;
  transition:border-color .12s,box-shadow .12s}
.hero:hover{border-color:var(--agua);box-shadow:0 2px 10px rgba(15,163,199,.08)}
.hero .fila{display:flex;align-items:center;gap:14px}
.hero .ico{width:52px;height:52px;border-radius:13px;background:var(--agua);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex-shrink:0}
.hero .tit{font-size:19px;font-weight:700}
.hero .desc{font-size:13.5px;color:var(--tinta-suave);margin-top:2px}
.hero .flecha{margin-left:auto;color:var(--agua);font-size:22px;flex-shrink:0}

/* Botón de notificaciones */
.notis-caja{margin-top:16px;padding-top:16px;border-top:1px solid var(--borde);display:none}
#btnNotis{width:100%;font-family:inherit;font-size:14.5px;font-weight:600;color:#fff;
  background:var(--agua);border:none;border-radius:10px;padding:13px 16px;cursor:pointer}
#btnNotis:active{background:var(--agua-oscuro)}
.notis-nota{font-size:12px;color:var(--tinta-suave);margin-top:8px;text-align:center}

/* Sección: más herramientas */
.seccion{margin:26px 0 8px;font-size:12px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--tinta-suave)}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:40px}
.tarjeta{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;
  padding:15px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;
  transition:border-color .12s}
.tarjeta:hover{border-color:var(--agua)}
.tarjeta .t-ico{width:36px;height:36px;border-radius:9px;background:var(--agua-claro);
  color:var(--agua-oscuro);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.tarjeta .t-tit{font-size:14.5px;font-weight:600}
.tarjeta .t-desc{font-size:12px;color:var(--tinta-suave)}
.pie{font-size:11.5px;color:var(--tinta-suave);text-align:center;padding:0 0 30px}
</style>
</head>
<body>
<div class="contenedor">

  <header>
    <div class="marca">Klimm</div>
    <div class="sub">Área comercial</div>
  </header>

  <!-- ===== AGENTE (lo urgente hoy) ===== -->
  <a class="hero" href="solon/panel_f1.html">
    <div class="fila">
      <div class="ico">A</div>
      <div>
        <div class="tit">Agente</div>
        <div class="desc">Leads y seguimiento — Sistema Solón</div>
      </div>
      <div class="flecha">›</div>
    </div>
  </a>

  <!-- Botón de notificaciones (aparece solo si el navegador las soporta) -->
  <div class="notis-caja" id="notisCaja">
    <button id="btnNotis" type="button">Activar notificaciones</button>
    <div class="notis-nota" id="notisNota">Te avisará cuando entre un lead sin atender.</div>
  </div>

  <!-- ===== MÁS HERRAMIENTAS =====
       Por ahora el hub muestra SOLO el Agente (decisión 21-sep, por
       confidencialidad: no enumerar URLs de herramientas en una página pública).
       Las demás se agregarán cuando termine la migración de Seguridad.

       Cuando toque, se agrega una sección con tarjetas así (ejemplo GENÉRICO,
       sin rutas reales a propósito):

         <div class="seccion">Más herramientas</div>
         <div class="rejilla">
           <a class="tarjeta" href="RUTA/ARCHIVO.html">
             <div class="t-ico">X</div>
             <div class="t-tit">Nombre</div>
             <div class="t-desc">Descripción</div>
           </a>
         </div>
  -->

  <div class="pie">Klimm · Área comercial</div>

</div>

<script>
/* ===== PWA: service worker + notificaciones =====
   Aislado. Si algo falla, la app sigue abriendo las herramientas igual. */
(function(){
  // 1) Registrar el service worker raíz (habilita instalar + notificaciones)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){
        console.warn('[PWA] service worker no registrado:', e);
      });
    });
  }

  // 1b) Limpiar el "globo" (badge) del ícono al abrir/volver a la app.
  //     El contador lo sube el service worker con cada lead; aquí se pone en 0.
  function limpiarGlobo(){
    try { if ('clearAppBadge' in navigator) navigator.clearAppBadge(); } catch(_){}
    try {
      if (!('indexedDB' in window)) return;
      var r = indexedDB.open('klimm', 1);
      r.onupgradeneeded = function(){ try { r.result.createObjectStore('kv'); } catch(_){} };
      r.onsuccess = function(){
        try { r.result.transaction('kv','readwrite').objectStore('kv').put(0, 'badge'); } catch(_){}
      };
    } catch(_){}
  }
  limpiarGlobo();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') limpiarGlobo();
  });

  // 2) Botón "Activar notificaciones" + suscripción al push del backend
  var caja = document.getElementById('notisCaja');
  var btn  = document.getElementById('btnNotis');
  var nota = document.getElementById('notisNota');
  if (!btn || !('Notification' in window)) return; // navegador sin soporte: no se muestra

  caja.style.display = 'block';

  // Reutiliza la conexión al backend que YA guardó el panel del Agente
  // (mismo dominio => mismo localStorage). Así no escribes la clave dos veces.
  function backendCfg(){
    try {
      return {
        url:   localStorage.getItem('solon_backend') || '',
        clave: localStorage.getItem('solon_clave')   || ''
      };
    } catch(_) { return { url:'', clave:'' }; }
  }

  // Convierte la llave pública VAPID (base64url) al formato que pide el navegador.
  function urlB64ToUint8Array(base64){
    var pad = '='.repeat((4 - base64.length % 4) % 4);
    var b64 = (base64 + pad).replace(/-/g,'+').replace(/_/g,'/');
    var raw = atob(b64);
    var arr = new Uint8Array(raw.length);
    for (var i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  function pintarEstado(){
    // Ya activadas en ESTE dispositivo: el botón desaparece (no estorba).
    // Se sigue auto-suscribiendo en silencio al cargar (ver abajo).
    if (Notification.permission === 'granted') {
      caja.style.display = 'none';
      return;
    }
    // Aún no activadas: mostrar el botón para poder activarlas (dispositivo nuevo).
    caja.style.display = 'block';
    if (Notification.permission === 'denied') {
      btn.textContent = 'Notificaciones bloqueadas';
      btn.disabled = true; btn.style.opacity = '.6';
      nota.textContent = 'Actívalas en Ajustes del iPhone › Klimm › Notificaciones.';
    } else {
      btn.textContent = 'Activar notificaciones';
      btn.disabled = false; btn.style.opacity = '1';
      nota.textContent = 'Actívalas para recibir avisos de leads sin atender.';
    }
  }

  // Pide al backend UNA notificación de prueba (confirma el camino servidor→iPhone).
  async function pruebaServidor(){
    var cfg = backendCfg();
    if (!cfg.url || !cfg.clave) return false;
    try {
      var r = await fetch(cfg.url + '/agente/push/prueba', {
        method: 'POST', headers: { 'x-backend-key': cfg.clave }
      });
      var d = await r.json();
      return !!(d && d.ok);
    } catch(_) { return false; }
  }

  // Suscribe ESTE dispositivo al push del backend. Devuelve true si quedó suscrito.
  async function suscribirPush(){
    var cfg = backendCfg();
    if (!cfg.url || !cfg.clave) {
      nota.textContent = 'Falta conexión: abre el Agente y configura backend + clave una vez.';
      return false;
    }
    var reg = await navigator.serviceWorker.ready;
    // (a) pedir la llave pública VAPID al backend
    var resp = await fetch(cfg.url + '/agente/push/clave-publica', { headers: { 'x-backend-key': cfg.clave } });
    var data = await resp.json();
    if (!data || !data.ok || !data.clave) {
      nota.textContent = 'El servidor aún no tiene el push encendido (PUSH_ON).';
      return false;
    }
    // (b) suscribirse en el navegador (reusa la suscripción si ya existe)
    var sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8Array(data.clave)
      });
    }
    // (c) mandar la suscripción al backend para que la guarde
    var r2 = await fetch(cfg.url + '/agente/push/suscribir', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'x-backend-key': cfg.clave },
      body: JSON.stringify(sub)
    });
    var d2 = await r2.json();
    return !!(d2 && d2.ok);
  }

  btn.addEventListener('click', async function(){
    // 1) Asegurar permiso (si aún no está dado).
    if (Notification.permission !== 'granted') {
      var permiso = await Notification.requestPermission();
      pintarEstado();
      if (permiso !== 'granted') return;
      // Prueba LOCAL inmediata la primera vez (confirma que el iPhone muestra notis).
      try {
        var reg = await navigator.serviceWorker.ready;
        reg.showNotification('Klimm · Agente', {
          body: '✅ Notificaciones listas.',
          icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'klimm-prueba'
        });
      } catch(_){ /* la prueba local no es crítica */ }
    }

    // 2) Suscribir (idempotente) + prueba DESDE EL SERVIDOR.
    try {
      nota.textContent = 'Conectando…';
      var ok = await suscribirPush();
      if (!ok) return; // suscribirPush ya dejó el motivo en la nota
      nota.textContent = 'Enviando prueba desde el servidor…';
      var okp = await pruebaServidor();
      nota.textContent = okp
        ? '🔔 Listo. Debe llegarte una notificación enviada por el servidor.'
        : '🔔 Suscrito. La prueba del servidor no llegó — revisa PUSH_ON / VAPID en Render.';
    } catch(e){
      console.warn('[push] no se pudo completar:', e);
      nota.textContent = 'No pude completar. Reintenta en un momento.';
    }
  });

  pintarEstado();

  // Si el permiso YA estaba dado (p. ej. de una prueba anterior), suscribe en
  // SILENCIO al cargar —idempotente— para que los leads reales lleguen aunque
  // no vuelvas a tocar el botón.
  if (Notification.permission === 'granted') {
    suscribirPush().catch(function(){});
  }
})();
</script>
</body>
</html>
