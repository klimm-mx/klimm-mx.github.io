<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Klimm</title>
<!-- ===== PWA: instalable + notificaciones en iPhone ===== -->
<meta name="theme-color" content="#0FA3C7">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Klimm">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --fondo:#F5F9FA; --superficie:#FFFFFF; --tinta:#16323B; --tinta-suave:#5A7480;
  --agua:#0FA3C7; --agua-oscuro:#0B7E9A; --agua-claro:#E3F4F9;
  --borde:#DCE7EB; --radio:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fondo);
  color:var(--tinta);font-size:15px;line-height:1.5;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
.contenedor{max-width:640px;margin:0 auto;padding:0 18px}

header{padding:26px 0 10px}
.marca{font-size:26px;font-weight:700;letter-spacing:-.4px}
.marca span{color:var(--agua)}
.sub{font-size:12px;color:var(--tinta-suave);letter-spacing:.9px;text-transform:uppercase;margin-top:2px}

/* Tarjeta principal: Agente */
.hero{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);
  padding:20px;margin-top:20px;text-decoration:none;color:inherit;display:block;
  transition:border-color .12s,box-shadow .12s}
.hero:hover{border-color:var(--agua);box-shadow:0 2px 10px rgba(15,163,199,.08)}
.hero .fila{display:flex;align-items:center;gap:14px}
.hero .ico{width:52px;height:52px;border-radius:13px;background:var(--agua);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex-shrink:0}
.hero .tit{font-size:19px;font-weight:700}
.hero .desc{font-size:13.5px;color:var(--tinta-suave);margin-top:2px}
.hero .flecha{margin-left:auto;color:var(--agua);font-size:22px;flex-shrink:0}

/* Botón de notificaciones */
.notis-caja{margin-top:16px;padding-top:16px;border-top:1px solid var(--borde);display:none}
#btnNotis{width:100%;font-family:inherit;font-size:14.5px;font-weight:600;color:#fff;
  background:var(--agua);border:none;border-radius:10px;padding:13px 16px;cursor:pointer}
#btnNotis:active{background:var(--agua-oscuro)}
.notis-nota{font-size:12px;color:var(--tinta-suave);margin-top:8px;text-align:center}

/* Sección: más herramientas */
.seccion{margin:26px 0 8px;font-size:12px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--tinta-suave)}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:40px}
.tarjeta{background:var(--superficie);border:1px solid var(--borde);border-radius:12px;
  padding:15px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;
  transition:border-color .12s}
.tarjeta:hover{border-color:var(--agua)}
.tarjeta .t-ico{width:36px;height:36px;border-radius:9px;background:var(--agua-claro);
  color:var(--agua-oscuro);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.tarjeta .t-tit{font-size:14.5px;font-weight:600}
.tarjeta .t-desc{font-size:12px;color:var(--tinta-suave)}
.pie{font-size:11.5px;color:var(--tinta-suave);text-align:center;padding:0 0 30px}
</style>
</head>
<body>
<div class="contenedor">

  <header>
    <div class="marca">Klimm</div>
    <div class="sub">Área comercial</div>
  </header>

  <!-- ===== AGENTE (lo urgente hoy) ===== -->
  <a class="hero" href="solon/panel_f1.html">
    <div class="fila">
      <div class="ico">A</div>
      <div>
        <div class="tit">Agente</div>
        <div class="desc">Leads y seguimiento — Sistema Solón</div>
      </div>
      <div class="flecha">›</div>
    </div>
  </a>

  <!-- Botón de notificaciones (aparece solo si el navegador las soporta) -->
  <div class="notis-caja" id="notisCaja">
    <button id="btnNotis" type="button">Activar notificaciones</button>
    <div class="notis-nota" id="notisNota">Te avisará cuando entre un lead sin atender.</div>
  </div>

  <!-- ===== MÁS HERRAMIENTAS =====
       Para AGREGAR una herramienta: copia un bloque <a class="tarjeta">…</a>
       y cambia el href, la letra del ícono, el título y la descripción.
       Para QUITAR una: borra su bloque. Nada más. -->
  <div class="seccion">Más herramientas</div>
  <div class="rejilla">

    <a class="tarjeta" href="solon/cotizador.html">
      <div class="t-ico">C</div>
      <div class="t-tit">Cotizador</div>
      <div class="t-desc">Cotizaciones</div>
    </a>

    <a class="tarjeta" href="solon/calculadora.html">
      <div class="t-ico">K</div>
      <div class="t-tit">Calculadora</div>
      <div class="t-desc">Cálculos</div>
    </a>

    <a class="tarjeta" href="luca/costos.html">
      <div class="t-ico">$</div>
      <div class="t-tit">Costos</div>
      <div class="t-desc">Sistema Luca</div>
    </a>

    <a class="tarjeta" href="luca/pricing.html">
      <div class="t-ico">P</div>
      <div class="t-tit">Pricing</div>
      <div class="t-desc">Sistema Luca</div>
    </a>

    <a class="tarjeta" href="luca/conciliador.html">
      <div class="t-ico">◎</div>
      <div class="t-tit">Conciliador</div>
      <div class="t-desc">Sistema Luca</div>
    </a>

  </div>

  <div class="pie">Klimm · Área comercial</div>

</div>

<script>
/* ===== PWA: service worker + notificaciones =====
   Aislado. Si algo falla, la app sigue abriendo las herramientas igual. */
(function(){
  // 1) Registrar el service worker raíz (habilita instalar + notificaciones)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){
        console.warn('[PWA] service worker no registrado:', e);
      });
    });
  }

  // 2) Botón "Activar notificaciones"
  var caja = document.getElementById('notisCaja');
  var btn  = document.getElementById('btnNotis');
  var nota = document.getElementById('notisNota');
  if (!btn || !('Notification' in window)) return; // navegador sin soporte: no se muestra

  caja.style.display = 'block';

  function pintarEstado(){
    if (Notification.permission === 'granted') {
      btn.textContent = '🔔 Notificaciones activas';
      btn.disabled = true; btn.style.opacity = '.6';
      nota.textContent = 'Listo. Te avisaré aquí de leads sin atender.';
    } else if (Notification.permission === 'denied') {
      btn.textContent = 'Notificaciones bloqueadas';
      btn.disabled = true; btn.style.opacity = '.6';
      nota.textContent = 'Actívalas en Ajustes del iPhone › Klimm › Notificaciones.';
    } else {
      btn.textContent = 'Activar notificaciones';
      btn.disabled = false; btn.style.opacity = '1';
      nota.textContent = 'Te avisará cuando entre un lead sin atender.';
    }
  }

  btn.addEventListener('click', function(){
    Notification.requestPermission().then(function(permiso){
      pintarEstado();
      if (permiso === 'granted') {
        // Prueba LOCAL (sin backend): confirma que este iPhone SÍ muestra notis.
        navigator.serviceWorker.ready.then(function(reg){
          reg.showNotification('Klimm · Agente', {
            body: '✅ Notificaciones listas. Aquí te avisaré de leads sin atender.',
            icon: 'icons/icon-192.png',
            badge: 'icons/icon-192.png',
            tag: 'klimm-prueba'
          });
        }).catch(function(e){ console.warn('[PWA] no se pudo mostrar la prueba:', e); });
      }
    });
  });

  pintarEstado();
})();
</script>
</body>
</html>
